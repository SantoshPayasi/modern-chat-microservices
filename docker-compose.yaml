services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: chat-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    networks:
      - chat-app-network

  user-db:
    image: postgres:16
    container_name: chatapp-user-db
    environment:
      POSTGRES_USER: ${USER_DB_USER:-chatapp_user}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-chatapp_user_password}
      POSTGRES_DB: ${USER_DB_NAME:-chatapp_user_service}
    ports:
      - "${USER_DB_PORT:-5432}:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - chat-app-network

  auth-db:
    image: mysql:8.0
    container_name: chat-auth-db
    environment:
      MYSQL_DATABASE: ${AUTH_DB_NAME:-chatpp_auth_service}
      MYSQL_USER: ${AUTH_DB_USER:-chatapp_auth_user}
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD:-chatapp_auth_password}
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD:-chatapp_auth_root_password}
    command: [ "mysqld", "--default-authentication-plugin=mysql_native_password" ]
    ports:
      - "${AUTH_DB_PORT:-3306}:3306"
    volumes:
      - auth-db-data:/var/lib/mysql
    networks:
      - chat-app-network

volumes:
  auth-db-data:
  user-db-data:


networks:
  chat-app-network:
    driver: bridge
